{% set name = "pynimate" %}
{% set version = "1.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pynimate-{{ version }}.tar.gz
  sha256: eb503f6ae29575f6cee4c69a08bddb4c9b29fdd6f790077d7972e76007fb9cc1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - pandas >=2.1
    - matplotlib-base >=3.8
    - seaborn >=0.13

test:
  imports:
    - pynimate
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/pynimate/
  summary: Python package for statistical data animations
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
