schema_version: 1

context:
  version: "1.4.2"

package:
  name: pynimate
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pynimate/pynimate-${{ version }}.tar.gz
  sha256: eb503f6ae29575f6cee4c69a08bddb4c9b29fdd6f790077d7972e76007fb9cc1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - pandas >=2.1
    - matplotlib-base >=3.8
    - seaborn >=0.13

tests:
  - python:
      imports:
        - pynimate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python package for statistical data animations
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/julkaar9/pynimate
  documentation: https://julkaar9.github.io/pynimate/

extra:
  recipe-maintainers:
    - ocefpaf
